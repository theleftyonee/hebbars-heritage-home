<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48.png" />
    <link rel="apple-touch-icon" href="/images/apple-touch.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hebbar’s Heritage Home — a heritage hostel on the fourth floor of Apeejay Chambers, Wallace Street, Fort, Bombay. Est. 1924."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Hebbar’s Heritage Home · Fort, Bombay</title>
    <style>
      #intro {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: #1b2a6b;
        transition: opacity 0.78s ease, visibility 0.78s ease;
      }
      #intro::before {
        content: "";
        position: absolute;
        width: min(420px, 80vw);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(244, 239, 228, 0.16), transparent 68%);
        pointer-events: none;
      }
      #intro .intro-seal {
        position: relative;
        width: min(176px, 46vw);
        aspect-ratio: 1;
        object-fit: contain;
        padding: 14px;
        box-sizing: border-box;
        border-radius: 50%;
        background: #f4efe4;
        box-shadow: 0 0 0 1px #c4a574;
        animation: introBreathe 2.6s ease-in-out infinite;
      }
      @keyframes introBreathe {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.82;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
      #intro.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      body.intro-open {
        overflow: hidden;
      }
      @media (prefers-reduced-motion: reduce) {
        #intro .intro-seal {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="intro-open">
    <div id="intro" role="status" aria-live="polite" aria-label="Hebbar’s Heritage Home is loading">
      <img class="intro-seal" src="/images/logo-seal.png" alt="" width="176" height="176" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
